# Venues map layer ingest (plan v2). SAVE BY HAND to .github/workflows/venues-ingest.yml.
# Claude cannot write under .github. After saving, add the repo secrets listed below if missing.
#
# Secrets used (names only, never values in Git):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (both already exist for the keepalive and seed jobs)
#
# Nothing here publishes a venue. The export step only writes venues that already passed the
# publish rule with human approved claims. With no approved venues the file is empty.
name: Venues ingest

on:
  schedule:
    - cron: "41 3 * * *" # nightly, 03:41 UTC
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stages to run"
        type: choice
        default: backup_only
        options: [backup_only, fetch_extract_export, discover_seeds, discover_overture]
      seeds_file:
        description: "Seeds CSV path (discover_seeds)"
        default: scripts/venues/seeds/barcelona.csv
      overture_release:
        description: "Overture release id, e.g. 2026-10-21.0 (discover_overture)"
        required: false
      overture_bbox:
        description: "west,south,east,north (discover_overture)"
        required: false
      overture_licence:
        description: "Licence string read from the release notes"
        required: false

permissions:
  contents: write

concurrency:
  group: venues-ingest
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tests (no network)
        run: npm run test:venues

      - name: Install menu tools (pdftotext, tesseract)
        if: github.event_name == 'workflow_dispatch' && inputs.stage != 'backup_only'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa

      - name: Discover from seeds
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'discover_seeds'
        run: node scripts/venues/discover.mjs --seeds "${{ inputs.seeds_file }}"

      - name: Install DuckDB CLI
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'discover_overture'
        run: |
          curl -fsSL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip
          unzip -o duckdb.zip && sudo mv duckdb /usr/local/bin/duckdb

      - name: Discover from Overture (bounding box)
        if: github.event_name == 'workflow_dispatch' && inputs.stage == 'discover_overture'
        run: node scripts/venues/discover.mjs --overture --release "${{ inputs.overture_release }}" --bbox="${{ inputs.overture_bbox }}" --licence "${{ inputs.overture_licence }}"

      - name: Resolve, geocode check, fetch menus, extract, export
        if: github.event_name == 'workflow_dispatch' && (inputs.stage == 'fetch_extract_export' || inputs.stage == 'discover_seeds' || inputs.stage == 'discover_overture')
        run: |
          node scripts/venues/resolve.mjs
          node scripts/venues/geocode_check.mjs --limit 20
          node scripts/venues/fetch_menu.mjs --limit 25
          node scripts/venues/extract.mjs
          node scripts/venues/export.mjs --out venues.geojson

      - name: Upload geojson as an artifact (no public bucket yet)
        if: github.event_name == 'workflow_dispatch' && (inputs.stage == 'fetch_extract_export' || inputs.stage == 'discover_seeds' || inputs.stage == 'discover_overture')
        uses: actions/upload-artifact@v4
        with:
          name: venues-geojson
          path: venues.geojson
          if-no-files-found: ignore

      - name: Nightly CSV export of public tables (never venue_submissions)
        run: node scripts/venues/backup_export.mjs --out backup

      - name: Artifact copy of the backup
        uses: actions/upload-artifact@v4
        with:
          name: venues-backup-csv
          path: backup
          retention-days: 30

      - name: Push CSVs to the venues-data branch
        run: |
          git config user.name "venues-bot"
          git config user.email "venues-bot@users.noreply.github.com"
          git fetch origin venues-data || true
          if git rev-parse --verify origin/venues-data >/dev/null 2>&1; then
            git checkout -B venues-data origin/venues-data
          else
            git checkout --orphan venues-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data
          cp backup/*.csv data/
          git add data
          if git diff --cached --quiet; then echo "No changes to back up"; else
            git commit -m "Venues backup $(date -u +%Y-%m-%d)"
            git push origin venues-data
          fi
